<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sedyoo</title>
  <meta name="description" content="Sedyoo - Independent game developer.">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f1;
      color: #26382c;
      line-height: 1.6;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    .brand {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #637067;
      margin-bottom: 48px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
    }

    a {
      color: #3f704d;
      font-weight: 600;
    }

    footer {
      color: #788079;
      margin-top: 48px;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <main>
    <h1 class="brand">Sedyoo</h1>
    <p class="subtitle">Independent game developer.</p>

    <section class="card">
      <h2>Focus Habitat</h2>
      <p>
        A cozy focus timer where productive sessions help grow
        your habitat, collect items, and progress through relaxing biomes.
      </p>

      <p>
        <a href="/privacy/focus-habitat/">Privacy Policy</a>
      </p>
    </section>

    <section class="card">
      <h2>Contact</h2>
      <p>
        Email:
        <a href="mailto:dev@sedyoo.com">dev@sedyoo.com</a>
      </p>
    </section>

    <footer>
      © 2026 Sedyoo
    </footer>
  </main>
</body>
</html>
